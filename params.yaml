scrape:
  source: hf  # "hf" = HuggingFace dataset (reproducible); "live" = IMDb GraphQL (needs WAF bypass)
  movie_ids:
    - tt0111161  # The Shawshank Redemption
    - tt0068646  # The Godfather
    - tt0468569  # The Dark Knight
    - tt1375666  # Inception
    - tt0050083  # 12 Angry Men
    - tt0110912  # Pulp Fiction
    - tt0137523  # Fight Club
    - tt0816692  # Interstellar
    - tt0245429  # Spirited Away
    - tt6751668  # Parasite

split:
  test_size: 0.15
  val_size: 0.15
  seed: 42

baseline:
  tfidf_max_features: 50000
  tfidf_ngram_min: 1
  tfidf_ngram_max: 2
  lr_C: 1.0
  lr_max_iter: 1000

transformer:
  model_name: distilbert-base-uncased
  lr: 2.0e-5
  batch_size: 16
  epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_length: 512
  # LoRA: enabled for drift-retraining loop. Set false for the initial full fine-tune.
  use_lora: false
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05

# v2 Review Intelligence — multi-task DistilBERT (sentiment + ABSA + emotion +
# spoiler + helpfulness). Per-task parquet paths are optional; pass at least
# one. See docs/future_improvements.md and src/.../data/multitask_loaders.py.
multitask:
  model_name: distilbert-base-uncased
  revision: ""
  lr: 2.0e-5
  batch_size: 16
  epochs: 2
  max_length: 256
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 42
  # Per-task loss weighting in the joint sum. Tune after first pass.
  loss_weights:
    sentiment: 1.0
    aspect: 1.0
    emotion: 1.0
    spoiler: 1.0
    helpfulness: 0.5
  # Optional per-task supervision parquets. Leave blank to skip a task.
  sentiment_path: data/processed/train.parquet
  spoiler_path: data/interim/multitask/spoiler.parquet
  emotion_path: data/interim/multitask/emotion.parquet
  absa_path: data/interim/multitask/absa.parquet
  helpfulness_path: data/interim/multitask/helpfulness.parquet
