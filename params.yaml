split:
  test_size: 0.15
  val_size: 0.15
  seed: 42

baseline:
  tfidf_max_features: 50000
  tfidf_ngram_min: 1
  tfidf_ngram_max: 2
  lr_C: 1.0
  lr_max_iter: 1000

transformer:
  model_name: distilbert-base-uncased
  lr: 2.0e-5
  batch_size: 16
  epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_length: 512
