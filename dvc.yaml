stages:
  scrape:
    cmd: python -m moviesentiment.cli scrape --out data/raw/reviews.parquet
    deps:
      - src/moviesentiment/data/scrape.py
    params:
      - scrape.source
      - scrape.movie_ids
    outs:
      - data/raw/reviews.parquet

  clean:
    cmd: python -m moviesentiment.cli clean --inp data/raw/reviews.parquet --out data/interim/clean.parquet
    deps:
      - data/raw/reviews.parquet
      - src/moviesentiment/data/clean.py
    outs:
      - data/interim/clean.parquet

  validate_data:
    cmd: python -m moviesentiment.data.validate data/interim/clean.parquet metrics/data_quality.json
    deps:
      - data/interim/clean.parquet
      - src/moviesentiment/data/validate.py
    metrics:
      - metrics/data_quality.json:
          cache: false

  split:
    cmd: python -m moviesentiment.cli split --inp data/interim/clean.parquet --out-dir data/processed
    deps:
      - data/interim/clean.parquet
      - metrics/data_quality.json
      - src/moviesentiment/data/split.py
    params:
      - split.test_size
      - split.val_size
      - split.seed
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet

  train_baseline:
    cmd: python -m moviesentiment.cli train baseline
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - src/moviesentiment/models/baseline.py
    params:
      - baseline
    metrics:
      - metrics/baseline.json:
          cache: false

  train_transformer:
    cmd: python -m moviesentiment.cli train transformer
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - src/moviesentiment/models/transformer.py
    params:
      - transformer
    metrics:
      - metrics/transformer.json:
          cache: false

  prep_emotion:
    cmd: python -m moviesentiment.cli prep-emotion
    deps:
      - src/moviesentiment/data/multitask_loaders.py
    outs:
      - data/interim/multitask/emotion.parquet

  prep_helpfulness:
    cmd: python -m moviesentiment.cli prep-helpfulness
    deps:
      - data/interim/clean.parquet
      - src/moviesentiment/data/multitask_loaders.py
    outs:
      - data/interim/multitask/helpfulness.parquet

  train_multitask:
    cmd: python -m moviesentiment.cli train multitask
    deps:
      - data/processed/train.parquet
      - data/interim/multitask/emotion.parquet
      - data/interim/multitask/helpfulness.parquet
      - src/moviesentiment/models/multitask.py
      - src/moviesentiment/models/multitask_train.py
    params:
      - multitask
    metrics:
      - metrics/multitask.json:
          cache: false

  export_multitask_onnx:
    cmd: python -m moviesentiment.models.onnx_export_multitask
    deps:
      - models/distilbert_multitask/model.pt
      - src/moviesentiment/models/onnx_export_multitask.py
    outs:
      - models/distilbert_multitask_onnx/model.onnx
