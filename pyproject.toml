[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moviesentiment"
version = "0.0.1"
description = "End-to-end MLOps sentiment analysis for IMDb reviews"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=15",
    "joblib>=1.3",
    "transformers>=4.38",
    "torch>=2.2",
    "datasets>=2.18",
    "optimum[onnxruntime]>=1.17",
    "onnxruntime>=1.17",
    "mlflow>=2.11",
    "dvc[s3]>=3.48",
    "evidently>=0.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "typer>=0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
train = [
    "sagemaker>=2.210,<3.0",
    "boto3>=1.34",
]
dev = [
    "ruff>=0.3",
    "black>=24.3",
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "locust>=2.24",
    "pre-commit>=3.6",
]

[project.scripts]
moviesentiment = "moviesentiment.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer.Option() in defaults is the intended typer pattern

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "moviesentiment.serve.api",
    "moviesentiment.cli",
]
disable_error_code = ["misc"]  # FastAPI/Typer decorators are untyped

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disable_error_code = ["misc"]  # pytest fixtures use untyped decorators

[[tool.mypy.overrides]]
module = [
    "moviesentiment.serve.inference",
    "moviesentiment.models.onnx_export",
    "moviesentiment.models.transformer",
]
disable_error_code = ["no-untyped-call"]  # transformers AutoTokenizer.from_pretrained lacks stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["moviesentiment"]
omit = [
    "tests/*",
    "src/moviesentiment/models/transformer.py",
    "src/moviesentiment/models/onnx_export.py",
    "src/moviesentiment/monitor/*",
    "src/moviesentiment/cli.py",
]
