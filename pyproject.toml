[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moviesentiment"
version = "0.0.1"
description = "End-to-end MLOps sentiment analysis for IMDb reviews"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=15",
    "joblib>=1.3",
    # transformers 5.x removes optimum-onnx compat; PYSEC-2025-217 has no compatible fix
    # yet and is exploitable only via untrusted model loading (we pin revision in code).
    "transformers>=4.57.6,<4.58",
    "torch>=2.2",
    "datasets>=2.18",
    "optimum[onnxruntime]>=1.17",
    "onnxruntime>=1.17",
    "mlflow>=2.11",
    "dvc[s3]>=3.48",
    "evidently>=0.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "typer>=0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "rich>=13.7",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24",
    # Security-tracked transitive pins (override unsafe versions pulled by ML stack)
    "setuptools>=78.1.1,<82",
    "starlette>=0.47.3",
]

[project.optional-dependencies]
train = [
    "sagemaker>=2.210,<3.0",
    "boto3>=1.34",
    "peft>=0.10",
    "accelerate>=0.28",
]
explain = [
    "captum>=0.7",
]
monitor = [
    "nannyml>=0.10",
    "great-expectations>=0.18",
]
dev = [
    "ruff>=0.3",
    "black>=24.3",
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.99,<6.130",  # 6.130+ has TreeNode.is_exhausted regression on py3.10
    "locust>=2.24",
    "pre-commit>=3.6",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
moviesentiment = "moviesentiment.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer.Option() in defaults is the intended typer pattern

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "moviesentiment.serve.api",
    "moviesentiment.serve.async_api",
    "moviesentiment.cli",
]
disable_error_code = ["misc"]  # FastAPI/Typer decorators are untyped

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disable_error_code = ["misc", "no-untyped-def", "no-untyped-call"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "moviesentiment.serve.inference",
    "moviesentiment.models.onnx_export",
    "moviesentiment.models.transformer",
]
disable_error_code = ["no-untyped-call"]  # transformers AutoTokenizer.from_pretrained lacks stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "scripts"]
# B101 assert ok in tests; B104 0.0.0.0 intentional inside container; B311 random not
# used for crypto (reservoir sampling); B404/B603/B607 git subprocess uses PATH lookup
# which is the documented portable behavior.
skips = ["B101", "B104", "B311", "B404", "B603", "B607"]

[tool.coverage.run]
source = ["moviesentiment"]
omit = [
    "tests/*",
    "src/moviesentiment/models/transformer.py",
    "src/moviesentiment/models/onnx_export.py",
    "src/moviesentiment/models/baseline.py",
    "src/moviesentiment/models/registry.py",
    "src/moviesentiment/monitor/perf_estimate.py",
    "src/moviesentiment/eval/metrics.py",
    "src/moviesentiment/serve/tracing.py",
    "src/moviesentiment/cli.py",
]
