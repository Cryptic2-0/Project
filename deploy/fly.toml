# Fly.io app config — deploy with: flyctl deploy --image ghcr.io/cryptic2-0/project:latest
app = "moviesentiment"
primary_region = "syd"

[build]
  image = "ghcr.io/cryptic2-0/project:latest"

[env]
  PORT = "8000"
  MS_MODEL_STAGE = "Production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    port = 8000
    timeout = "5s"
    type = "http"
