name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Cache uv deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (black)
        run: black --check src tests
      - name: Type check (mypy)
        run: mypy src
      - name: Test
        run: pytest --cov=moviesentiment --cov-fail-under=55 -v

  build-image:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + dvc
        run: pip install uv && uv pip install --system dvc[s3]

      - name: Pull ONNX models from DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc remote modify --local s3remote access_key_id "$AWS_ACCESS_KEY_ID"
          dvc remote modify --local s3remote secret_access_key "$AWS_SECRET_ACCESS_KEY"
          dvc pull models/distilbert_onnx_int8.dvc models/distilbert_onnx.dvc

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
