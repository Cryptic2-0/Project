name: ci

on:
  push:
    branches: [main, release/v3.2]
  pull_request:
  workflow_call:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Cache uv deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (black)
        run: black --check src tests
      - name: Type check (mypy)
        run: mypy src tests
      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src -ll
      - name: Dependency vuln scan (pip-audit)
        # Documented residual risks (see SECURITY.md):
        #   PYSEC-2025-217 / CVE-2026-1839  transformers — fix in 5.0.0rc3 breaks optimum
        #   PYSEC-2026-161                   starlette — fix 1.0.1 incompatible w/ fastapi 0.136
        #   MAL-2026-4750                    fastapi — OSV false positive on 0.136.x
        #   CVE-2025-69872                   diskcache — no upstream fix
        #   CVE-2026-27448 / 27459           pyOpenSSL — pinned by pydrive2 (dvc transitive)
        run: |
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln MAL-2026-4750 \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln CVE-2026-27448 \
            --ignore-vuln CVE-2026-27459
      - name: Test
        run: pytest -m "not slow" --cov=moviesentiment --cov-fail-under=85 -v
      - name: Calibration regression gate
        # Allow-missing: brier.json is only produced by full eval runs, not
        # by `pytest -m "not slow"`. When the retrain workflow writes the
        # file, this step starts enforcing the threshold.
        run: python scripts/check_calibration.py --allow-missing

  build-image:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv + dvc
        run: pip install uv && uv pip install --system dvc[s3]

      - name: Pull ONNX models from DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc remote modify --local s3remote access_key_id "$AWS_ACCESS_KEY_ID"
          dvc remote modify --local s3remote secret_access_key "$AWS_SECRET_ACCESS_KEY"
          dvc pull models/distilbert_onnx_int8.dvc models/distilbert_onnx.dvc

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Lowercase repo name
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}:latest
            375259955411.dkr.ecr.ap-southeast-2.amazonaws.com/moviesentiment:${{ github.sha }}
            375259955411.dkr.ecr.ap-southeast-2.amazonaws.com/moviesentiment:latest

      - name: Force ECS redeploy
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          aws ecs update-service \
            --cluster moviesentiment \
            --service moviesentiment \
            --force-new-deployment \
            --region ap-southeast-2
